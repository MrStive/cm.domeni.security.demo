spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/security_db"
    username: "postgres"
    password: "domenisteve@gmail.com"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
           issuer-uri: ${ISSUER-URI:http://localhost:8080/realms/your-realm}
           jwk-set-uri: ${jwtk-set-uri:http://localhost:8080/realms/your-realm/protocol/openid-connect/certs}

logging:
  level:
    org.springframework.security: INFO

domeni:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:mySecretKeysForGeneratedToken1234567890}
      expiration-time: ${JWT_EXPIRATION-TIME:300000}
